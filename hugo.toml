baseURL = "https://meerwert.ch/"
languageCode = "de-CH"
title = "meerwert – kuonen"
enableRobotsTXT = true
# (paginate entfernt — keine Pagination im Einsatz; Perspektiven-Liste rendert alle Beiträge direkt.)

[params]
  description = "Biografische Beratung für Menschen, die Orientierung suchen. Begleitung in Übergängen und Entscheidungen."
  author = "Bernhard Kuonen"
  email = "info@meerwert.ch"
  location = "Luzern / Münster (Wallis)"
  ctaText = "Gespräch anfragen"
  ctaURL = "/kontakt/"
  # Formspark-Formular-ID für das Kontaktformular (bewährter Stack).
  # Leer = Formular deaktiviert (kein Versand). Zum Aktivieren: Formular auf
  # https://formspark.io anlegen und die ID hier eintragen.
  formsparkId = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # unsafe = true erlaubt rohes HTML in Markdown-Inhalten. Bewusst aktiviert,
      # damit im CMS gepflegte Texte bei Bedarf HTML enthalten dürfen. Vertretbar,
      # da Inhalte ausschliesslich vom Betreiber (nicht von Dritten) stammen.
      unsafe = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
