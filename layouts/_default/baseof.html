<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <!-- Open Graph -->
  {{ $ogType := cond (and .IsPage (eq .Section "perspektiven")) "article" "website" }}
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="{{ $ogType }}">
  <meta property="og:image" content="{{ "/img/og-image.jpg" | absURL }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:locale" content="de_CH">
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ "/img/og-image.jpg" | absURL }}">
  <!-- Fonts: lokal via @font-face in main.css (kein externer Request) -->
  <link rel="preload" href="/fonts/lora-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/space-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- CSS -->
  {{ $css := resources.Get "css/main.css" | minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <!-- Strukturierte Daten (JSON-LD) -->
  {{- partial "schema.html" . -}}
</head>
<body>

  {{- partial "header.html" . -}}

  <main id="main">
    {{- block "main" . }}{{- end }}
  </main>

  {{- partial "footer.html" . -}}

  <script>
    // Mobile Navigation Toggle
    const toggle = document.getElementById('nav-toggle');
    const header = document.getElementById('site-header');
    if (toggle && header) {
      toggle.addEventListener('click', () => {
        header.classList.toggle('nav-open');
        const expanded = header.classList.contains('nav-open');
        toggle.setAttribute('aria-expanded', expanded);
      });
      // Schliessen bei Link-Klick
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
          header.classList.remove('nav-open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>

</body>
</html>
