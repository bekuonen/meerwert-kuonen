{{ define "main" }}
<div class="container">

  <div class="page-header">
    <h1>Ein Gespräch beginnt mit einer Klärung</h1>
    <p>{{ .Params.intro }}</p>
  </div>

  {{- $key := .Site.Params.web3formsKey | default "" -}}
  {{- $configured := ne $key "" -}}
  <div class="kontakt-form">
    <form
      name="kontakt"
      method="POST"
      action="https://api.web3forms.com/submit"
    >
      <!-- Web3Forms Access Key (aus hugo.toml → params.web3formsKey; leer = deaktiviert) -->
      <input type="hidden" name="access_key" value="{{ $key }}">
      <input type="hidden" name="subject" value="Neue Anfrage über meerwert.ch">
      <input type="hidden" name="redirect" value="{{ .Site.BaseURL }}danke/">

      <!-- Honeypot Spam-Schutz -->
      <div class="form-honey" aria-hidden="true">
        <input type="text" name="_honey" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="">
      </div>

      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="">
      </div>

      <div class="form-group">
        <label for="nachricht">Nachricht</label>
        <textarea id="nachricht" name="nachricht" required rows="5"></textarea>
      </div>

      <button type="submit" class="btn btn--primary"{{ if not $configured }} disabled{{ end }}>Nachricht senden</button>
      {{ if not $configured }}
      <p class="form-hinweis" style="margin-top: 1rem; color: var(--color-muted);">
        Das Kontaktformular wird in Kürze aktiviert.
      </p>
      {{ end }}
    </form>
  </div>

</div>
{{ end }}
